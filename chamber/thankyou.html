<!DOCTYPE html>
<html lang="en">


<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sokomoko Chamber of Commerce</title>

    <meta name="description" content="Welcome to the Sokomoko Chamber of Commerce. Discover businesses, events, and opportunities in Sokomoko.">

    <meta name="author" content="Kelvine Owino Inganga">

    <link rel="icon" href="images/favicon.png">

    <!-- Open Graph Meta -->
    <meta property="og:title" content="Sokomoko Chamber of Commerce - Supporting Local Business">
    <meta property="og:description" content="Discover businesses, events, and opportunities in Sokomoko through the Chamber of Commerce.">
    <meta property="og:image" content="https://kelvine123.github.io/chamber/images/hero.png">
    <meta property="og:url" content="https://kelvine123.github.io/chamber/index.html">
    <meta property="og:type" content="website">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles/normalize.css">
    <link rel="stylesheet" href="styles/small.css">
    <link rel="stylesheet" href="styles/larger.css">

    <script src="scripts/home.js" defer></script>
    <script src="scripts/date.js" defer></script>

</head>

<body>

    <header>
        <h1>Thank You for Joining</h1>
    </header>

    <main>
        <p>Thank you for submitting your membership application. Here’s what we received:</p>

        <ul id="results"></ul>
    </main>


    <footer>

        <p><strong>Sokomoko Chamber of Commerce</strong></p>

        <p>
            123 Business Street<br> Sokomoko, Kenya<br> Phone: +254 700 123 456<br> Email: info@sokomoko.org
        </p>

        <p>Engineer Kelvine | WDD 231</p>

        <p id="lastModified"></p>

    </footer>

    <script>
        // Function to format ISO timestamp nicely
        function formatTimestamp(isoString) {
            if (!isoString) return "";
            const date = new Date(isoString);
            return date.toLocaleString(); // e.g., 3/23/2026, 3:45:12 PM
        }

        // Populate the results list with URL parameters
        function populateResults() {
            const params = new URLSearchParams(window.location.search);
            const resultsEl = document.getElementById("results");

            if (!resultsEl) return;

            resultsEl.innerHTML = `
        <li><strong>First Name:</strong> ${params.get("firstname") || ""}</li>
        <li><strong>Last Name:</strong> ${params.get("lastname") || ""}</li>
        <li><strong>Email:</strong> ${params.get("email") || ""}</li>
        <li><strong>Phone:</strong> ${params.get("phone") || ""}</li>
        <li><strong>Business:</strong> ${params.get("business") || ""}</li>
        <li><strong>Membership Level:</strong> ${params.get("membership") || ""}</li>
         <li><strong>Business Description:</strong> ${params.get("description") || ""}</li>
        <li><strong>Date Submitted:</strong> ${formatTimestamp(params.get("timestamp"))}</li>
      `;
        }

        // Run after page loads
        document.addEventListener("DOMContentLoaded", populateResults);
    </script>
    <script>
        // Update current year (if you have a <span id="year"></span>)
        const yearEl = document.getElementById("year");
        if (yearEl) {
            yearEl.textContent = new Date().getFullYear();
        }

        // Update last modified
        const lastModEl = document.getElementById("lastModified");
        if (lastModEl) {
            const modifiedDate = new Date(document.lastModified);
            lastModEl.textContent = "Last Modified: " + modifiedDate.toLocaleString();
        }
    </script>
    <ul id="results"></ul>

    <script>
        const params = new URLSearchParams(window.location.search);
        const timestamp = params.get("timestamp");
        document.getElementById("results").innerHTML = `
    <li>Date Submitted: ${timestamp ? new Date(timestamp).toLocaleString() : "N/A"}</li>
  `;
    </script>

</body>

</html>
